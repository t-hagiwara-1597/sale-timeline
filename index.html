<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>セールタイムライン</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #f5f7fa; color: #333; }
    h1 { font-size: 20px; margin-bottom: 20px; font-weight: bold; }
    .tabs { margin-bottom: 15px; display: flex; gap: 8px; flex-wrap: wrap; }
    .tab-btn { padding: 8px 16px; border: none; background: #e4e7eb; border-radius: 20px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
    .tab-btn.active { background-color: #007bff; color: white; font-weight: bold; }
    
    .timeline-outer { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: hidden; }
    .timeline-scroll { overflow-x: auto; width: 100%; position: relative; }
    .timeline-grid { min-width: 1200px; position: relative; padding: 20px 0; }
    
    .timeline-row { display: flex; align-items: center; height: 50px; border-bottom: 1px solid #f0f2f5; position: relative; }
    .site-name { width: 150px; font-weight: bold; font-size: 14px; padding-left: 15px; box-sizing: border-box; flex-shrink: 0; z-index: 2; background: white; box-shadow: 5px 0 5px rgba(0,0,0,0.02); }
    
    .bar-container { position: relative; flex-grow: 1; height: 32px; margin-right: 15px; }
    .sale-bar { position: absolute; height: 100%; background: #ffe082; border-left: 4px solid #ffb300; display: flex; align-items: center; font-size: 12px; color: #5d4037; border-radius: 0 4px 4px 0; padding: 0 10px; box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
    
    .date-axis { display: flex; border-top: 1px solid #ddd; background: #fafbfc; padding-left: 15px; }
    .axis-label-space { width: 150px; flex-shrink: 0; }
    .axis-labels { display: flex; justify-content: space-between; flex-grow: 1; margin-right: 15px; font-size: 11px; color: #777; padding: 8px 0; }
  </style>
</head>
<body>

  <h1>📅 セールスケジュール（タイムライン）</h1>

  <div class="tabs" id="tabsContainer">
    <button class="tab-btn active" onclick="filterCategory('すべて')">すべて</button>
  </div>

  <div class="timeline-outer">
    <div class="timeline-scroll">
      <div class="timeline-grid" id="timelineContainer">
        データの読み込み中...
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://google.com';

    let allSalesData = [];
    let categories = new Set(['すべて']);

    async function fetchSalesData() {
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('データ取得に失敗しました');
        allSalesData = await response.json();
        
        allSalesData.forEach(sale => {
          if (sale.category) categories.add(sale.category);
        });

        renderTabs();
        renderTimeline(allSalesData);
      } catch (error) {
        document.getElementById('timelineContainer').innerText = 'データの読み込みに失敗しました。詳細: ' + error.message;
        console.error(error);
      }
    }

    function renderTabs() {
      const container = document.getElementById('tabsContainer');
      container.innerHTML = '';
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${cat === 'すべて' ? 'active' : ''}`;
        btn.innerText = cat;
        btn.onclick = () => filterCategory(cat, btn);
        container.appendChild(btn);
      });
    }

    function filterCategory(category, clickedBtn) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (clickedBtn) clickedBtn.classList.add('active');

      const filtered = category === 'すべて' ? allSalesData : allSalesData.filter(sale => sale.category === category);
      renderTimeline(filtered);
    }

    function renderTimeline(sales) {
      const container = document.getElementById('timelineContainer');
      container.innerHTML = '';

      if (sales.length === 0) {
        container.innerHTML = '<div style="padding:20px;color:#999;">該当するセール情報はありません。</div>';
        return;
      }

      const today = new Date();
      today.setHours(0,0,0,0);
      const minTime = today.getTime() - (14 * 24 * 60 * 60 * 1000);
      const maxTime = today.getTime() + (14 * 24 * 60 * 60 * 1000);
      const totalDuration = maxTime - minTime;

      sales.forEach(sale => {
        if (!sale.startTime || !sale.endTime) return;
        
        const start = new Date(sale.startTime).getTime();
        const end = new Date(sale.endTime).getTime();

        if (isNaN(start) || isNaN(end)) return;
        if (end < minTime || start > maxTime) return;

        const displayStart = Math.max(start, minTime);
        const displayEnd = Math.min(end, maxTime);

        const leftPercent = ((displayStart - minTime) / totalDuration) * 100;
        const widthPercent = ((displayEnd - displayStart) / totalDuration) * 100;

        const row = document.createElement('div');
        row.className = 'timeline-row';

        const nameDiv = document.createElement('div');
        nameDiv.className = 'site-name';
        nameDiv.innerText = sale.siteName;

        const barContainer = document.createElement('div');
        barContainer.className = 'bar-container';

        const bar = document.createElement('div');
        bar.className = 'sale-bar';
        bar.style.left = `${leftPercent}%`;
        bar.style.width = `${widthPercent}%`;
        
        const formatD = (d) => `${d.getMonth()+1}/${d.getDate()}`;
        bar.innerText = `${sale.memo || sale.category} (${formatD(new Date(start))}〜${formatD(new Date(end))})`;
        bar.title = `${sale.siteName} : ${sale.memo || ''}`;

        barContainer.appendChild(bar);
        row.appendChild(nameDiv);
        row.appendChild(barContainer);
        container.appendChild(row);
      });

      const axis = document.createElement('div');
      axis.className = 'date-axis';
      axis.innerHTML = `
        <div class="axis-label-space"></div>
        <div class="axis-labels">
          <span>⬅️ 14日前 (${new Date(minTime).toLocaleDateString()})</span>
          <span style="color:#007bff;font-weight:bold;">📍 今日 (${new Date().toLocaleDateString()})</span>
          <span>14日後 (${new Date(maxTime).toLocaleDateString()}) ➡️</span>
        </div>
      `;
      container.appendChild(axis);
    }

    fetchSalesData();
  </script>
</body>
</html>
