<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>セールタイムライン</title>
  <!-- パス解決を確実にするため相対パスでCSSを指定 -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <h1>📅 セールカレンダータイムライン</h1>

  <div class="tabs" id="tabsContainer">
    <button class="tab-btn active" onclick="filterCategory('すべて')">すべて</button>
  </div>

  <div class="timeline-outer">
    <div class="timeline-scroll" id="timelineScroll">
      <div class="timeline-grid" id="timelineContainer">
        データの読み込み中...
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://google.com';

    let allSalesData = [];
    let categories = new Set(['すべて']);

    const today = new Date();
    today.setHours(0,0,0,0);
    
    const DAY_WIDTH = 25; 
    const ONE_DAY_MS = 24 * 60 * 60 * 1000;
    const minTime = today.getTime() - (14 * ONE_DAY_MS);
    const maxTime = today.getTime() + (14 * ONE_DAY_MS);

    async function fetchSalesData() {
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('データ取得失敗');
        allSalesData = await response.json();
        
        allSalesData.forEach(sale => {
          if (sale.category) categories.add(sale.category);
        });

        renderTabs();
        renderTimeline(allSalesData);
        scrollToToday();
      } catch (error) {
        document.getElementById('timelineContainer').innerText = 'データの読み込みに失敗しました。';
        console.error(error);
      }
    }

    function renderTabs() {
      const container = document.getElementById('tabsContainer');
      container.innerHTML = '';
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${cat === 'すべて' ? 'active' : ''}`;
        btn.innerText = cat;
        btn.onclick = () => filterCategory(cat, btn);
        container.appendChild(btn);
      });
    }

    function filterCategory(category, clickedBtn) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (clickedBtn) clickedBtn.classList.add('active');

      const filtered = category === 'すべて' ? allSalesData : allSalesData.filter(sale => sale.category === category);
      renderTimeline(filtered);
    }

    function renderTimeline(sales) {
      const container = document.getElementById('timelineContainer');
      container.innerHTML = '';

      const bgContainer = document.createElement('div');
      bgContainer.className = 'grid-bg-lines';
      container.appendChild(bgContainer);

      for (let i = -14; i <= 14; i++) {
        const leftPx = (i + 14) * DAY_WIDTH;
        const bgLine = document.createElement('div');
        bgLine.className = 'bg-line';
        bgLine.style.left = `${leftPx}px`;
        bgContainer.appendChild(bgLine);
      }

      const tLine = document.createElement('div');
      tLine.className = 'today-line';
      tLine.style.left = `${120 + (14 * DAY_WIDTH)}px`;
      container.appendChild(tLine);

      sales.forEach(sale => {
        if (!sale.startTime || !sale.endTime) return;
        const start = new Date(sale.startTime).getTime();
        const end = new Date(sale.endTime).getTime();

        if (isNaN(start) || isNaN(end) || end < minTime || start > maxTime) return;

        const leftDays = (start - minTime) / ONE_DAY_MS;
        const endDays = (end - minTime) / ONE_DAY_MS;

        const leftPx = Math.max(0, leftDays * DAY_WIDTH);
        const rightPx = Math.min(700, endDays * DAY_WIDTH);
        const widthPx = Math.max(10, rightPx - leftPx);

        const row = document.createElement('div');
        row.className = 'timeline-row';

        const nameDiv = document.createElement('div');
        nameDiv.className = 'site-name';
        nameDiv.innerText = sale.siteName;

        const barContainer = document.createElement('div');
        barContainer.className = 'bar-container';

        const bar = document.createElement('div');
        const catClass = sale.category === '総合EC' ? 'bar-総合ec' : (sale.category === 'コスメ' ? 'bar-コスメ' : 'bar-default');
        bar.className = `sale-bar ${catClass}`;
        bar.style.left = `${leftPx}px`;
        bar.style.width = `${widthPx}px`;
        
        const formatM_D = (d) => `${d.getMonth()+1}/${d.getDate()}`;
        bar.innerText = `${sale.memo || sale.category} (${formatM_D(new Date(start))}〜${formatM_D(new Date(end))})`;
        bar.title = `${sale.siteName} : ${sale.memo || ''}`;

        barContainer.appendChild(bar);
        row.appendChild(nameDiv);
        row.appendChild(barContainer);
        container.appendChild(row);
      });

      renderDateAxis(container);
    }

    function renderDateAxis(container) {
      const axis = document.createElement('div');
      axis.className = 'date-axis';
      
      const space = document.createElement('div');
      space.className = 'axis-label-space';
      axis.appendChild(space);

      const labelsContainer = document.createElement('div');
      labelsContainer.className = 'axis-labels-container';

      for (let i = -14; i <= 14; i++) {
        const tickDate = new Date(today.getTime() + (i * ONE_DAY_MS));
        const leftPx = (i + 14) * DAY_WIDTH;
        
        const tick = document.createElement('div');
        tick.className = 'axis-tick' + (i === 0 ? ' is-today' : '');
        tick.style.left = `${leftPx}px`;
        
        if (i === 0) {
          tick.innerHTML = '<span>今日</span>';
        } else {
          tick.innerHTML = `<span>${tickDate.getMonth()+1}/${tickDate.getDate()}</span>`;
        }
        labelsContainer.appendChild(tick);
      }

      axis.appendChild(labelsContainer);
      container.appendChild(axis);
    }

    function scrollToToday() {
      const scrollArea = document.getElementById('timelineScroll');
      const scrollTarget = (14 * DAY_WIDTH) - (scrollArea.clientWidth / 2) + 120;
      scrollArea.scrollLeft = Math.max(0, scrollTarget);
    }

    fetchSalesData();
  </script>
</body>
</html>
