<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>セールタイムライン</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .tabs { margin-bottom: 20px; }
    .tab-btn { padding: 10px 20px; margin-right: 5px; cursor: pointer; }
    .tab-btn.active { background-color: #007bff; color: white; font-weight: bold; }
    .timeline-container { border: 1px solid #ccc; padding: 10px; position: relative; overflow-x: auto; }
    .timeline-row { display: flex; align-items: center; margin-bottom: 15px; border-bottom: 1px dashed #eee; padding-bottom: 10px; }
    .site-name { width: 120px; font-weight: bold; flex-shrink: 0; }
    .bar-container { position: relative; flex-grow: 1; height: 40px; background: #f9f9f9; min-width: 600px; }
    .sale-bar { position: absolute; height: 100%; background: #ffc107; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #333; border-radius: 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 5px; box-sizing: border-box; }
    .date-axis { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: #666; border-top: 1px solid #aaa; padding-top: 5px; }
  </style>
</head>
<body>

  <h1>セールスケジュール（タイムライン）</h1>

  <div class="tabs" id="tabsContainer">
    <button class="tab-btn active" onclick="filterCategory('すべて')">すべて</button>
  </div>

  <div class="timeline-container" id="timelineContainer">
    データの読み込み中...
  </div>

  <script>
    // あなたのGASウェブアプリURL（末尾は/exec）
    const API_URL = 'https://script.google.com/macros/s/AKfycbyjfcDxaBkvVhvCvvpMn9xUPm3soLLfAkizuXg0lOhimXaq0q625a5dCueRxhpaniJm/exec';

    let allSalesData = [];
    let categories = new Set(['すべて']);

    // 通常のfetch通信による確実なデータ取得
    async function fetchSalesData() {
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('Network response was not ok');
        allSalesData = await response.json();

        allSalesData.forEach(sale => {
          if (sale.category) categories.add(sale.category);
        });

        renderTabs();
        renderTimeline(allSalesData);
      } catch (error) {
        document.getElementById('timelineContainer').innerText = 'データの読み込みに失敗しました。詳細: ' + error.message;
        console.error(error);
      }
    }

    function renderTabs() {
      const container = document.getElementById('tabsContainer');
      container.innerHTML = '';
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${cat === 'すべて' ? 'active' : ''}`;
        btn.innerText = cat;
        btn.onclick = () => filterCategory(cat, btn);
        container.appendChild(btn);
      });
    }

    function filterCategory(category, clickedBtn) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (clickedBtn) clickedBtn.classList.add('active');

      const filtered = category === 'すべて'
        ? allSalesData
        : allSalesData.filter(sale => sale.category === category);

      renderTimeline(filtered);
    }

    function renderTimeline(sales) {
      const container = document.getElementById('timelineContainer');
      container.innerHTML = '';

      if (sales.length === 0) {
        container.innerText = '該当するセール情報はありません。';
        return;
      }

      const times = sales.flatMap(s => [new Date(s.startTime).getTime(), new Date(s.endTime).getTime()]);
      const minTime = Math.min(...times);
      const maxTime = Math.max(...times);
      const totalDuration = maxTime - minTime;

      sales.forEach(sale => {
        const start = new Date(sale.startTime).getTime();
        const end = new Date(sale.endTime).getTime();

        const leftPercent = totalDuration > 0 ? ((start - minTime) / totalDuration) * 100 : 0;
        const widthPercent = totalDuration > 0 ? ((end - start) / totalDuration) * 100 : 100;

        const row = document.createElement('div');
        row.className = 'timeline-row';

        const nameDiv = document.createElement('div');
        nameDiv.className = 'site-name';
        nameDiv.innerText = sale.siteName;

        const barContainer = document.createElement('div');
        barContainer.className = 'bar-container';

        const bar = document.createElement('div');
        bar.className = 'sale-bar';
        bar.style.left = `${leftPercent}%`;
        bar.style.width = `${widthPercent}%`;
        bar.innerText = sale.memo ? `${sale.category} : ${sale.memo}` : sale.category;
        bar.title = `${sale.siteName} (${sale.startTime} ～ ${sale.endTime})`;

        barContainer.appendChild(bar);
        row.appendChild(nameDiv);
        row.appendChild(barContainer);
        container.appendChild(row);
      });

      const axis = document.createElement('div');
      axis.className = 'date-axis';
      axis.innerHTML = `<span>開始: ${new Date(minTime).toLocaleString()}</span><span>終了: ${new Date(maxTime).toLocaleString()}</span>`;
      container.appendChild(axis);
    }

    // 起動
    fetchSalesData();
  </script>
</body>
</html>
